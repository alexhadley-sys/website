<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
{% feed_meta %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
<header class="header">
<a class="brand" href="{{ '/' | relative_url }}"><span class="monogram" aria-hidden="true">a.</span><span>Alex’s Journal</span></a>
<nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Journal</a><a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></nav>
</header>
<main id="main">{{ content }}</main>
<footer><span>A little corner of the internet.</span><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a><a href="https://github.com/alexhadley-sys/website">GitHub ↗</a></footer>
</div>
</body>
</html>
